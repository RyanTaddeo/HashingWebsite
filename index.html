<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto-Hash Simulation Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #38bdf8;
            --success-bg: rgba(22, 101, 52, 0.3);
            --success-text: #4ade80;
            --danger-bg: rgba(153, 27, 27, 0.3);
            --danger-text: #f87171;
            --code-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2.5rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #f1f5f9;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        /* Metric Summary Cards Layout */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .metric-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .metric-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        input[type="text"], select {
            padding: 0.65rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        input[type="text"] {
            flex: 1;
            min-width: 260px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(15, 23, 42, 0.6);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(51, 65, 85, 0.3);
        }

        .code-pill {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            background-color: var(--code-bg);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 9999px;
            letter-spacing: 0.025em;
        }

        .badge-passed {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .badge-failed {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .status-bar {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Cryptographic Hash & Interception Audit</h1>
        <p class="subtitle">Live telemetry from C++ simulation session (ASCII Square Mod 1066 Scheme)</p>
    </header>

    <!-- Top Summary Metrics Grid -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-title">Total Logs</div>
            <div class="metric-value" id="metricTotal">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Authentication Passed</div>
            <div class="metric-value" id="metricPassed" style="color: var(--success-text);">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Tampering / Failed</div>
            <div class="metric-value" id="metricFailed" style="color: var(--danger-text);">0</div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search message body, hash value, or key...">
        <select id="statusFilter">
            <option value="ALL">All Statuses</option>
            <option value="PASSED">Passed Only</option>
            <option value="FAILED">Failed Only</option>
        </select>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Private Key</th>
                    <th>Message Body</th>
                    <th>Algorithm</th>
                    <th>Hash Digest</th>
                    <th>Auth Status</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Populated via JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="status-bar">
        <span id="rowCount">Loading records...</span>
        <span id="dataSource">Source: Initializing...</span>
    </div>
</div>

<script>
    const fallbackData = [
        {
            id: 3,
            input: "Secret transmission test alpha",
            privateKey: "4321",
            algorithm: "ASCII-Square (Mod 1066)",
            hash: 742,
            status: "PASSED",
            timestamp: "2026-11-18 16:15:00"
        }
    ];

    let allRecords = [];

    async function loadData() {
        const sourceLabel = document.getElementById('dataSource');
        try {
            const response = await fetch('./hashes.json');
            if (!response.ok) throw new Error('File not found');
            allRecords = await response.json();
            sourceLabel.textContent = "Source: Live hashes.json from C++ run";
        } catch (error) {
            allRecords = fallbackData;
            sourceLabel.textContent = "Source: Sample Data (Run C++ program and upload hashes.json to override)";
        }

        updateMetrics(allRecords);
        renderTable(allRecords);
    }

    function updateMetrics(data) {
        document.getElementById('metricTotal').textContent = data.length;
        const passedCount = data.filter(item => item.status === "PASSED").length;
        const failedCount = data.filter(item => item.status === "FAILED").length;
        document.getElementById('metricPassed').textContent = passedCount;
        document.getElementById('metricFailed').textContent = failedCount;
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const rowCount = document.getElementById('rowCount');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding: 2rem;">No matching session logs found.</td></tr>`;
            rowCount.textContent = "Showing 0 records";
            return;
        }

        data.forEach(item => {
            const isPassed = item.status === "PASSED";
            const badgeClass = isPassed ? "badge-passed" : "badge-failed";

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>#${item.id}</strong></td>
                <td><span class="code-pill">${escapeHTML(String(item.privateKey))}</span></td>
                <td style="max-width: 250px; overflow: hidden; text-overflow: ellipsis;" title="${escapeHTML(String(item.input))}">${escapeHTML(String(item.input))}</td>
                <td style="color: var(--text-muted);">${escapeHTML(item.algorithm)}</td>
                <td><span class="code-pill" style="color: var(--accent); font-weight: bold;">${item.hash}</span></td>
                <td><span class="badge ${badgeClass}">${item.status}</span></td>
                <td style="color: var(--text-muted);">${escapeHTML(item.timestamp || 'N/A')}</td>
            `;
            tbody.appendChild(tr);
        });

        rowCount.textContent = `Showing ${data.length} of ${allRecords.length} records`;
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const selectedStatus = document.getElementById('statusFilter').value;

        const filtered = allRecords.filter(item => {
            const matchesStatus = selectedStatus === 'ALL' || item.status === selectedStatus;
            const matchesText = 
                String(item.input).toLowerCase().includes(query) ||
                String(item.hash).includes(query) ||
                String(item.privateKey).toLowerCase().includes(query) ||
                String(item.id).includes(query);
            return matchesStatus && matchesText;
        });

        renderTable(filtered);
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag]));
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('statusFilter').addEventListener('change', filterData);

    loadData();
</script>

</body>
</html>
